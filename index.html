<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Yara's wereld</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Een rustige speel- en leerapp voor een peuter van anderhalf, om samen met papa of mama te gebruiken.">
  <meta name="theme-color" content="#bfe3f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yara">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div id="stage" aria-live="off"></div>

    <div id="topbar" hidden>
      <button id="btn-home" class="round-btn" aria-label="Terug naar de wereld"></button>
      <div id="hint" class="hint" hidden></div>
      <button id="btn-parent" class="round-btn small" aria-label="Voor ouders"></button>
    </div>

    <div id="overlay" hidden></div>
  </div>

  <noscript>Deze app heeft JavaScript nodig.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
